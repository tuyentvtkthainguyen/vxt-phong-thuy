name: Build Setup

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release cần build lại (vd v1.5.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Inno Setup (nếu runner chưa có)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Lấy số phiên bản
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.tag || github.ref_name }}"
          if ($v -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Ghi số phiên bản vào phần mềm
        shell: pwsh
        run: |
          $f = "app/index.html"
          $t = [IO.File]::ReadAllText($f)
          [IO.File]::WriteAllText($f, $t.Replace("__APP_VERSION__", "${{ steps.ver.outputs.version }}"), (New-Object Text.UTF8Encoding $false))

      - name: Biên dịch Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\VXT_PhongThuy.iss

      - name: Lưu file cài (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: VXT_PhongThuy_Setup
          path: Output/*.exe

      - name: Đăng lên Releases (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $files = Get-ChildItem Output\*.exe | ForEach-Object { $_.FullName }
          for ($i = 1; $i -le 6; $i++) {
            gh release upload $tag $files --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Lỗi tải lên, thử lại lần $i sau 20 giây..."
            Start-Sleep -Seconds 20
          }
          exit 1

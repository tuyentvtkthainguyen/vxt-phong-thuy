name: Web cài trên điện thoại (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ghi phiên bản
        run: |
          V="web-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__APP_VERSION__/$V/g" app/sw.js
          sed -i "s/const APP_VERSION='__APP_VERSION__'/const APP_VERSION='$V'/" app/index.html
          rm -f app/icon.ico
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
